<!--
  SNIPPET: botón "Volver al menú"
  =================================
  IMPORTANTE: el index.html principal vive AFUERA de esta carpeta
  (dwproject/), un nivel arriba. Por eso el link al menú necesita
  un "../" extra respecto a los links de assets/.

  1) Copia la línea del <link> y la del <a> dentro del <body>
     de la página principal de TU juego (justo después de <body>).
  2) Ajusta las rutas según la profundidad de la carpeta de tu
     juego respecto a la raíz de dwproject/ (los assets) y respecto
     a la raíz real del sitio (el index.html, un nivel más afuera):

       juegos/mi-juego/index.html   -> assets: ../../      | index: ../../../
       juegos/mi-juego/nivel2.html  -> assets: ../../      | index: ../../../
       juegos/mi-juego/sub/x.html   -> assets: ../../../   | index: ../../../../

  3) Si tu juego usa <canvas> a pantalla completa, el botón queda
     flotando encima gracias a "position: fixed" — no necesitas
     hacer nada más.
-->

<link rel="stylesheet" href="../../assets/volver.css">

<a href="../../../index.html" class="btn-volver">
  <span class="icono">⬅</span><span class="texto">VOLVER</span>
</a>

<!-- Estos dos scripts van antes de cerrar </body>. Le dan sonido al botón.
     Si tu juego no quiere sonido, simplemente no los incluyas. -->
<script src="../../assets/sound.js"></script>
<script src="../../assets/volver.js"></script>
