<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Dynamic Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/volver.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #70c5ce;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: manipulation;
            outline: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: clamp(24px, 5vw, 46px);
            color: #f7d302;
            -webkit-text-stroke: 3px #000;
            text-shadow: 4px 4px 0px #000;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        h2 {
            font-size: clamp(12px, 2.2vw, 18px);
            color: #ffffff;
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .input-group label {
            font-size: clamp(10px, 1.4vw, 13px);
            color: #fff;
            text-shadow: 2px 2px 0px #000;
        }

        .player-input {
            font-family: 'Press Start 2P', monospace;
            background: #fff;
            border: 4px solid #000;
            color: #333;
            padding: 12px 16px;
            font-size: clamp(12px, 1.8vw, 16px);
            text-align: center;
            border-radius: 8px;
            outline: none;
            width: 80%;
            max-width: 280px;
            text-transform: uppercase;
        }

        .highscore-box {
            background: #ded895;
            border: 4px solid #543847;
            border-radius: 12px;
            padding: 18px 25px;
            margin-bottom: 25px;
            font-size: clamp(10px, 1.4vw, 13px);
            color: #543847;
            line-height: 1.8;
            box-shadow: 0 6px 0px #aa9f57;
        }

        .highscore-box span {
            color: #e86100;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            font-family: 'Press Start 2P', monospace;
            background: #e86100;
            border: 4px solid #000;
            color: #fff;
            padding: 16px 32px;
            font-size: clamp(12px, 1.8vw, 16px);
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 5px 0px #9e4200;
            transition: transform 0.1s;
        }

        .btn-secondary {
            background: #73bf2e;
            box-shadow: 0 5px 0px #4a821a;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #000;
        }

        #hud {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(32px, 6vw, 56px);
            color: #fff;
            -webkit-text-stroke: 3px #000;
            text-shadow: 3px 3px 0px #000;
            z-index: 5;
            pointer-events: none;
        }

        #countdown {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(32px, 6vw, 60px);
            color: #f7d302;
            -webkit-text-stroke: 3px #000;
            text-shadow: 4px 4px 0px #000;
            z-index: 6;
            pointer-events: none;
        }
    </style>
    <link rel="stylesheet" href="../../assets/mobile-game.css">
</head>
<body data-game="flappy">

    <a href="../../index.html" class="btn-volver" aria-label="Volver al menú principal">
        <span class="icono">⬅</span><span class="texto">VOLVER</span>
    </a>

    <div id="game-container">
        <div id="hud" class="hidden">0</div>
        <div id="countdown" class="hidden">3</div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-menu" class="overlay">
            <h1>FLAPPY BIRD</h1>
            <h2>EDICIÓN CLÁSICA</h2>

            <div class="input-group">
                <label for="player-name">INGRESA TU NOMBRE:</label>
                <input type="text" id="player-name" class="player-input" maxlength="10" value="JUGADOR 1" onclick="this.select()">
            </div>

            <div class="highscore-box">
                🏆 RÉCORD MÁXIMO: <br>
                <span id="best-record-display">NADIE - 0 PTS</span>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="prepareGame(event)">¡JUGAR!</button>
            </div>
        </div>

        <div id="game-over-menu" class="overlay hidden">
            <h1 style="color: #e86100;">GAME OVER</h1>
            <h2 id="new-record-tag" style="color: #f7d302;" class="hidden">¡NUEVO RÉCORD! 🎉</h2>
            
            <div class="highscore-box" style="width: 90%; max-width: 350px;">
                JUGADOR: <span id="summary-name" style="color: #0088cc;">-</span><br><br>
                PUNTOS: <span id="final-score" style="color: #73bf2e; font-size: 18px;">0</span><br><br>
                MEJOR RÉCORD: <span id="summary-best" style="color: #e86100;">0</span>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="prepareGame(event)">REINTENTAR</button>
                <button class="btn btn-secondary" onclick="showMenu(event)">MENÚ PRINCIPAL</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const hud = document.getElementById('hud');
        const countdownEl = document.getElementById('countdown');
        const startMenu = document.getElementById('start-menu');
        const gameOverMenu = document.getElementById('game-over-menu');
        const playerNameInput = document.getElementById('player-name');
        const bestRecordDisplay = document.getElementById('best-record-display');
        
        const finalScoreText = document.getElementById('final-score');
        const summaryName = document.getElementById('summary-name');
        const summaryBest = document.getElementById('summary-best');
        const newRecordTag = document.getElementById('new-record-tag');

        let gameState = 'START';
        let score = 0;
        let frameCount = 0;
        let currentPlayer = "JUGADOR 1";

        let highScore = parseInt(localStorage.getItem('flappy_classic_highscore')) || 0;
        let highScoreHolder = localStorage.getItem('flappy_classic_holder') || 'NADIE';

        // Temas variables según el puntaje (de 10 en 10)
        const themes = [
            {
                birdColor: '#f7d302',
                pipeBody: '#73bf2e', pipeLight: '#9ce659', pipeDark: '#558022',
                sky: '#70c5ce', city: '#8ce0a8', ground: '#ded895'
            },
            {
                birdColor: '#ff4d4d',
                pipeBody: '#e040fb', pipeLight: '#ea80fc', pipeDark: '#aa00ff',
                sky: '#ff7043', city: '#d84315', ground: '#d7ccc8'
            },
            {
                birdColor: '#29b6f6',
                pipeBody: '#ffd700', pipeLight: '#ffecb3', pipeDark: '#ff8f00',
                sky: '#1a237e', city: '#0d47a1', ground: '#90a4ae'
            },
            {
                birdColor: '#ab47bc',
                pipeBody: '#00e676', pipeLight: '#b9f6ca', pipeDark: '#00a152',
                sky: '#4a148c', city: '#311b92', ground: '#b0bec5'
            }
        ];

        function getTheme() {
            const level = Math.floor(score / 10) % themes.length;
            return themes[level];
        }

        function updateHighScoreDisplay() {
            if (highScore > 0) {
                bestRecordDisplay.innerText = `${highScoreHolder} - ${highScore} PTS`;
            } else {
                bestRecordDisplay.innerText = "NADIE - 0 PTS";
            }
        }
        updateHighScoreDisplay();

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.09);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
                osc.start(now);
                osc.stop(now + 0.09);
            } else if (type === 'score') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            }
        }

        const bird = {
            x: 100,
            y: window.innerHeight / 2,
            radius: 14,
            gravity: 0.42,
            jumpForce: -7.5,
            velocity: 0,
            rotation: 0,
            draw: function() {
                const currentTheme = getTheme();
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.velocity < 0) {
                    this.rotation = -0.35;
                } else {
                    this.rotation += 0.05;
                    if (this.rotation > 1.2) this.rotation = 1.2;
                }
                ctx.rotate(this.rotation);

                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000000';

                // Cuerpo con color cambiante
                ctx.fillStyle = currentTheme.birdColor;
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Panza blanca
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-4, 4, 8, 0, Math.PI * 2);
                ctx.fill();

                // Ojo grande clásico
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(6, -5, 6, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Pupila
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(8, -5, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Pico naranja
                ctx.fillStyle = '#f75302';
                ctx.beginPath();
                ctx.rect(4, 2, 14, 8);
                ctx.fill();
                ctx.stroke();

                // Ala animada
                let wingY = Math.sin(frameCount * 0.3) * 3;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(-8, 2 + wingY, 7, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                if (this.y + this.radius >= canvas.height - 56) {
                    this.y = canvas.height - 56 - this.radius;
                    playSound('hit');
                    triggerGameOver();
                }
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },
            jump: function() {
                this.velocity = this.jumpForce;
                playSound('jump');
            },
            reset: function() {
                this.y = canvas.height / 2;
                this.velocity = 0;
                this.rotation = 0;
            }
        };

        const triggerJump = (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            if (gameState === 'PLAYING') bird.jump();
        };

        window.addEventListener('mousedown', triggerJump);
        window.addEventListener('touchstart', (e) => {
            triggerJump(e);
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (e.repeat) return; // Evita que mantener presionada la tecla dispare saltos en cadena
                if (gameState === 'PLAYING') bird.jump();
            }
        });

        const obstacles = [];
        const obstacleWidth = 70;

        function createObstacle() {
            const gap = 145;
            const minHeight = 60;
            const maxHeight = canvas.height - gap - minHeight - 80;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            obstacles.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - gap - 56,
                passed: false
            });
        }

        function updateObstacles() {
            if (frameCount % 105 === 0) {
                createObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= 3;

                const birdLeft = bird.x - bird.radius + 2;
                const birdRight = bird.x + bird.radius - 2;
                const birdTop = bird.y - bird.radius + 2;
                const birdBottom = bird.y + bird.radius - 2;

                if (
                    birdRight > obs.x &&
                    birdLeft < obs.x + obstacleWidth &&
                    (birdTop < obs.top || birdBottom > canvas.height - 56 - obs.bottom)
                ) {
                    playSound('hit');
                    triggerGameOver();
                }

                if (!obs.passed && obs.x + obstacleWidth < bird.x) {
                    obs.passed = true;
                    score++;
                    hud.innerText = score;
                    playSound('score');
                }

                if (obs.x + obstacleWidth < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function drawObstacles() {
            const currentTheme = getTheme();
            obstacles.forEach(obs => {
                const drawPipe = (x, y, width, height, isTop) => {
                    ctx.fillStyle = currentTheme.pipeBody;
                    ctx.fillRect(x, y, width, height);

                    ctx.fillStyle = currentTheme.pipeLight;
                    ctx.fillRect(x + 4, y, 6, height);
                    ctx.fillStyle = currentTheme.pipeDark;
                    ctx.fillRect(x + width - 10, y, 6, height);

                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#000000';
                    ctx.strokeRect(x, y, width, height);

                    const capHeight = 24;
                    const capY = isTop ? y + height - capHeight : y;
                    
                    ctx.fillStyle = currentTheme.pipeBody;
                    ctx.fillRect(x - 4, capY, width + 8, capHeight);

                    ctx.fillStyle = currentTheme.pipeLight;
                    ctx.fillRect(x, capY, 6, capHeight);
                    ctx.fillStyle = currentTheme.pipeDark;
                    ctx.fillRect(x + width - 4, capY, 6, capHeight);

                    ctx.strokeRect(x - 4, capY, width + 8, capHeight);
                };

                drawPipe(obs.x, 0, obstacleWidth, obs.top, true);
                drawPipe(obs.x, canvas.height - 56 - obs.bottom, obstacleWidth, obs.bottom, false);
            });
        }

        function drawBackground() {
            const currentTheme = getTheme();

            // 1. Cielo
            ctx.fillStyle = currentTheme.sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Nubes
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            let cloudOffset = (frameCount * 0.3) % 200;
            for (let x = -cloudOffset; x < canvas.width + 200; x += 200) {
                ctx.beginPath();
                ctx.arc(x, canvas.height - 120, 30, 0, Math.PI * 2);
                ctx.arc(x + 25, canvas.height - 130, 40, 0, Math.PI * 2);
                ctx.arc(x + 55, canvas.height - 120, 30, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. Silueta de Ciudad
            ctx.fillStyle = currentTheme.city;
            let cityOffset = (frameCount * 0.6) % 120;
            for (let x = -cityOffset; x < canvas.width + 120; x += 40) {
                ctx.fillRect(x, canvas.height - 90, 25, 34);
                ctx.fillRect(x + 10, canvas.height - 105, 18, 50);
            }

            // 4. Suelo
            const floorY = canvas.height - 56;
            ctx.fillStyle = currentTheme.ground;
            ctx.fillRect(0, floorY, canvas.width, 56);

            ctx.fillStyle = currentTheme.pipeBody;
            ctx.fillRect(0, floorY, canvas.width, 14);
            ctx.fillStyle = currentTheme.pipeDark;
            ctx.fillRect(0, floorY + 11, canvas.width, 3);

            ctx.fillStyle = currentTheme.pipeLight;
            let stripeOffset = (frameCount * 3) % 20;
            for (let x = -stripeOffset; x < canvas.width + 20; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, floorY);
                ctx.lineTo(x + 10, floorY);
                ctx.lineTo(x, floorY + 11);
                ctx.fill();
            }

            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000000';
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(canvas.width, floorY);
            ctx.stroke();
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            drawBackground();
            bird.update();
            bird.draw();
            updateObstacles();
            drawObstacles();

            requestAnimationFrame(gameLoop);
        }

        function prepareGame(e) {
            if (e) e.stopPropagation();
            initAudio();

            const inputVal = playerNameInput.value.trim().toUpperCase();
            if (inputVal !== "") {
                currentPlayer = inputVal;
            }

            startMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');

            score = 0;
            frameCount = 0;
            obstacles.length = 0;
            bird.reset();

            hud.innerText = '0';
            hud.classList.remove('hidden');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            bird.draw();

            gameState = 'COUNTDOWN';
            countdownEl.classList.remove('hidden');
            let count = 3;
            countdownEl.innerText = count;

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else if (count === 0) {
                    countdownEl.innerText = "¡LISTO!";
                } else {
                    clearInterval(timer);
                    countdownEl.classList.add('hidden');
                    gameState = 'PLAYING';
                    gameLoop();
                }
            }, 750);
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            hud.classList.add('hidden');

            let isNewRecord = false;
            if (score > highScore) {
                highScore = score;
                highScoreHolder = currentPlayer;
                localStorage.setItem('flappy_classic_highscore', highScore);
                localStorage.setItem('flappy_classic_holder', highScoreHolder);
                isNewRecord = true;
            }

            summaryName.innerText = currentPlayer;
            finalScoreText.innerText = score;
            summaryBest.innerText = `${highScore} (${highScoreHolder})`;

            if (isNewRecord) {
                newRecordTag.classList.remove('hidden');
            } else {
                newRecordTag.classList.add('hidden');
            }

            updateHighScoreDisplay();
            gameOverMenu.classList.remove('hidden');
        }

        function showMenu(e) {
            if (e) e.stopPropagation();
            gameOverMenu.classList.add('hidden');
            startMenu.classList.remove('hidden');
            gameState = 'START';
        }

    </script>
    <script src="../../assets/volver.js"></script>
</body>
</html>
