<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arcade — Menú de juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/mobile-game.css">
</head>
<body data-game="arcade-menu">

  <div class="grid-floor"></div>
  <div class="crt-overlay"></div>
  <div class="crt-vignette"></div>
  <div class="flash-transition"></div>

  <button id="btn-sonido" class="btn-sonido" type="button" aria-label="Silenciar sonido">🔊</button>
  <div class="titulo-fijo" aria-hidden="true">DESARROLLO WEB</div>

  <main class="arcade-wrap">
    <div class="marquee">
      <h1>DESARROLLO WEB</h1>
      <div class="subtitulo">Selecciona tu juego</div>
    </div>

    <div class="coin-slot">◀ INSERTA FICHA PARA CONTINUAR ▶</div>

    <div class="games-grid" id="games-grid">
    </div>

    <div class="arcade-footer">
    12° "2" - Informatica
    </div>
  </main>

  <script src="assets/sound.js"></script>
  <script src="assets/script.js"></script>
</body>
</html>
